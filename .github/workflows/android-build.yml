name: Build ArabUnlim APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: تجميع وبناء ملف APK (ArabUnlim)
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود المصدري (Checkout)
        uses: actions/checkout@v4

      - name: إعداد بيئة Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: إعداد Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بناء ملف APK التجريبي (Assemble Debug APK)
        run: gradle assembleDebug --stacktrace

      - name: رفع ملف APK الجاهز للتحميل (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArabUnlim-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
